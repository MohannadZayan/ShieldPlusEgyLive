name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, write the Pages deployment, and prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a half-uploaded
# site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      # Kept because deploy-pages expects Pages to be configured for this run.
      # Its `base_path` / `origin` outputs are deliberately NOT used — see below.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build static site
        env:
          # The site is served at the ROOT of the custom domain, so there is no
          # URL prefix. Empty is correct — do not reintroduce a base path.
          #
          # This was previously `steps.pages.outputs.base_path`, which reported
          # "/ShieldPlusEgyLive" even after the custom domain was live. Every
          # asset URL was then prefixed with a folder that does not exist at the
          # domain root, so the CSS, JS, fonts and images all 404'd and the page
          # rendered unstyled. Declaring the target explicitly removes that guess.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://shieldplusegy.com
        run: npm run build

      - name: Fail if the export looks wrong
        run: |
          test -f out/index.html      || { echo "::error::out/index.html missing — the root language hop will 404"; exit 1; }
          test -f out/en/index.html   || { echo "::error::out/en/index.html missing"; exit 1; }
          test -f out/ar/index.html   || { echo "::error::out/ar/index.html missing"; exit 1; }
          test -f out/.nojekyll       || { echo "::error::out/.nojekyll missing — Jekyll will strip /_next and the CSS/JS will 404"; exit 1; }
          test -d out/media           || { echo "::error::out/media missing — photos and video will 404"; exit 1; }

          # Regression guard. The repo name must never appear in a URL: at the
          # domain root it resolves to a folder that isn't there, which is
          # exactly the failure this check exists to prevent.
          if grep -rlE '(href|src|poster)="/ShieldPlusEgyLive/' out >/dev/null 2>&1; then
            echo "::error::Asset URLs are prefixed with /ShieldPlusEgyLive/ but the site deploys at the domain root. Check NEXT_PUBLIC_BASE_PATH."
            grep -rhoE '(href|src|poster)="/ShieldPlusEgyLive/[^"]*"' out | sort -u | head
            exit 1
          fi

          # Assets must be root-absolute and actually present on disk.
          missing=0
          for url in $(grep -rhoE '(href|src)="/_next/[^"]*"' out | sed -E 's/.*="([^"]*)"/\1/' | sort -u); do
            [ -f "out$url" ] || { echo "::error::referenced but not exported: $url"; missing=1; }
          done
          [ "$missing" = "0" ] || exit 1

          echo "Export looks good:"
          echo "  $(find out -name '*.html' | wc -l) HTML pages"
          echo "  $(ls out/media | wc -l) media files"
          echo "  $(grep -rhoE '(href|src)="/_next/[^"]*"' out | sort -u | wc -l) unique /_next assets, all present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
