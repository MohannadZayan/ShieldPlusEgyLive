name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, write the Pages deployment, and prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a half-uploaded
# site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build static site
        env:
          # Project Pages serve from /<repo>/, so the app needs that prefix.
          # `configure-pages` works it out; it is empty for a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Fail if the export looks wrong
        run: |
          test -f out/index.html      || { echo "::error::out/index.html missing — the root language hop will 404"; exit 1; }
          test -f out/en/index.html   || { echo "::error::out/en/index.html missing"; exit 1; }
          test -f out/ar/index.html   || { echo "::error::out/ar/index.html missing"; exit 1; }
          test -f out/.nojekyll       || { echo "::error::out/.nojekyll missing — Jekyll will strip /_next and the CSS/JS will 404"; exit 1; }
          test -d out/media           || { echo "::error::out/media missing — photos and video will 404"; exit 1; }
          echo "Export looks good:"
          echo "  $(find out -name '*.html' | wc -l) HTML pages"
          echo "  $(ls out/media | wc -l) media files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
